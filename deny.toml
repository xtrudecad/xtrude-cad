# SPDX-License-Identifier: GPL-3.0-or-later
# SPDX-FileCopyrightText: 2026 The Xtrude CAD Authors (see AUTHORS)
# cargo-deny: every dependency must be GPL-3.0-or-later compatible.
[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "GPL-3.0-or-later",
    "LGPL-2.1-or-later",
    # OpenCascade (occt-sys, clarified below), linked into the STEP helper
    # only; GPL-3.0 compatible through LGPL-2.1 section 3.
    "LGPL-2.1-only WITH OCCT-exception-1.0",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
]

# occt-sys declares the deprecated `LGPL-2.1`; OpenCascade's own terms
# are the LGPL 2.1 with its exception (OCCT/OCCT_LGPL_EXCEPTION.txt).
[[licenses.clarify]]
crate = "occt-sys"
expression = "LGPL-2.1-only WITH OCCT-exception-1.0"
license-files = [{ path = "OCCT/LICENSE_LGPL_21.txt", hash = 0x2436c1a4 }]

[licenses.private]
ignore = false

[bans]
multiple-versions = "allow"

[advisories]
# Unmaintained, not vulnerable: zbus 6 merged zbus_names and zvariant
# into itself, but the screen-reader stack (eframe's `accesskit` feature)
# still needs zbus 5. Remove these when an accesskit release moves to zbus 6.
ignore = [
    { id = "RUSTSEC-2026-0370", reason = "zvariant unmaintained; eframe accesskit → accesskit_unix → atspi → zbus 5, until an accesskit release on zbus 6" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names unmaintained; eframe accesskit → accesskit_unix → atspi → zbus 5, until an accesskit release on zbus 6" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive unmaintained; eframe accesskit → accesskit_unix → atspi → zbus 5, until an accesskit release on zbus 6" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
