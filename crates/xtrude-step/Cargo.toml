[package]
name = "xtrude-step"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Xtrude CAD STEP reader: a helper program that tessellates a STEP file with OpenCascade"
publish = false

[[bin]]
name = "xtrude-step"
path = "src/main.rs"

# OpenCascade is built from source (about 17 minutes, CMake and a C++17
# compiler), so it is opt-in: without `occt` the helper is a stub that
# says so, and `cargo build`/`cargo test --workspace` stay fast. Release
# builds turn it on: `cargo build --release -p xtrude-step --features occt`.
[features]
occt = ["dep:cxx", "dep:cxx-build", "dep:libc", "dep:occt-sys"]

[dependencies]
xtrude-io.workspace = true
glam.workspace = true
cxx = { version = "1", optional = true }
libc = { version = "0.2", optional = true }

[build-dependencies]
cxx-build = { version = "1", optional = true }
occt-sys = { version = "=7.8.1", optional = true }

[lints]
workspace = true
