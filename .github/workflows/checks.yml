# The check job, written once: `ci.yml` and the release workflow call it.
# It runs `scripts/check.sh` as is (fmt, clippy, tests, cargo-deny, SPDX,
# reuse lint). GPU tests skip themselves without an adapter.
name: checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads `rust-toolchain.toml`; install it before the cache
      # step, which keys on the compiler version.
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad # v2.87.26
        with:
          tool: cargo-deny@0.20.2
      - name: Install reuse
        run: pipx install reuse
      - name: Run the checks
        run: scripts/check.sh
